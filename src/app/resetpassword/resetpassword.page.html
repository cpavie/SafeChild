<ion-header>
  <ion-toolbar>
    <div class="sc-header-row">
      <ion-button class="sc-icon-btn" (click)="dismiss()">
        <ion-icon slot="icon-only" name="chevron-back"></ion-icon>
      </ion-button>
      <div class="sc-header-titles">
        <p class="sc-title">Recuperar contraseña</p>
      </div>
      <app-theme-toggle></app-theme-toggle>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="sc-stack">
    <p class="reset-intro">
      Le enviaremos un enlace para crear una nueva contraseña.
    </p>

    <div class="sc-field">
      <ion-icon name="mail-outline"></ion-icon>
      <div class="sc-field-body">
        <div class="sc-field-label">Correo</div>
        <ion-input
          type="email"
          inputmode="email"
          placeholder="Ingrese su correo"
          [(ngModel)]="correo"
        ></ion-input>
      </div>
    </div>

    <ion-button class="sc-btn sc-btn--tall" expand="block" (click)="resetPassword()">
      Enviar enlace
    </ion-button>
    <ion-button class="sc-btn" expand="block" fill="clear" (click)="dismiss()">
      Volver
    </ion-button>
  </div>
</ion-content>
