<ion-header>
  <ion-toolbar>
    <ion-title>Perfil</ion-title>
    <ion-buttons slot="end">
      <app-theme-toggle></app-theme-toggle>
      <ion-button (click)="ayuda()">
        <ion-icon slot="icon-only" name="help-circle-outline"></ion-icon>
      </ion-button>
      <ion-button (click)="logout()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="app-card profile-card">
    <ion-avatar class="avatar">
      <ion-icon class="avatar-fallback" name="person-circle"></ion-icon>
      <img
        src="{{this.dataService.getDataApoderado().apo_fotoperfil}}"
        alt=""
        onerror="this.style.display='none'"
      />
    </ion-avatar>
    <h2 class="profile-name">
      {{this.dataService.getDataApoderadoPersona().p_nombres}}
    </h2>

    <ion-list class="app-list" lines="full">
      <ion-item>
        <ion-icon slot="start" name="person-outline"></ion-icon>
        <ion-label>Nombres</ion-label>
        <ion-input readonly value="{{this.dataService.getDataApoderadoPersona().p_nombres}}"></ion-input>
      </ion-item>
      <ion-item>
        <ion-icon slot="start" name="person-outline"></ion-icon>
        <ion-label>Apellidos</ion-label>
        <ion-input readonly value="{{this.dataService.getDataApoderadoPersona().p_apellidos}}"></ion-input>
      </ion-item>
      <ion-item>
        <ion-icon slot="start" name="calendar-outline"></ion-icon>
        <ion-label>Fecha de nacimiento</ion-label>
        <ion-input readonly value="{{this.dataService.getDataApoderadoPersona().p_fecnac}}"></ion-input>
      </ion-item>
      <ion-item>
        <ion-icon slot="start" name="mail-outline"></ion-icon>
        <ion-label>Correo</ion-label>
        <ion-input readonly value="{{this.dataService.getDataApoderado().apo_correo}}"></ion-input>
      </ion-item>
    </ion-list>

    <p class="app-section-title">Datos editables</p>
    <ion-list class="app-list" lines="full">
      <ion-item>
        <ion-icon slot="start" name="location-outline"></ion-icon>
        <ion-label position="stacked">Dirección</ion-label>
        <ion-input id="direccion" [(ngModel)]="direccion" value="{{this.direccion}}"></ion-input>
      </ion-item>
      <ion-item>
        <ion-icon slot="start" name="map-outline"></ion-icon>
        <ion-label position="stacked">Comuna</ion-label>
        <ion-input id="comuna" [(ngModel)]="comuna" value="{{this.comuna}}"></ion-input>
      </ion-item>
      <ion-item>
        <ion-icon slot="start" name="call-outline"></ion-icon>
        <ion-label position="stacked">Teléfono</ion-label>
        <ion-input id="telefono" inputmode="numeric" [(ngModel)]="telefono" value="{{this.telefono}}"></ion-input>
      </ion-item>
    </ion-list>

    <div class="profile-actions">
      <ion-button shape="round" (click)="save()">Confirmar</ion-button>
      <ion-button shape="round" color="medium" fill="outline" (click)="reset()">Cancelar</ion-button>
    </div>

    <ion-button expand="block" fill="clear" shape="round" (click)="goResetPassword()">
      Cambiar contraseña
    </ion-button>
  </div>
</ion-content>
