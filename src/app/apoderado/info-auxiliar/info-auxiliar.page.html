<ion-header>
  <ion-toolbar>
    <ion-title>Información Auxiliar</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="app-card">
    <ion-avatar class="avatar">
      <ion-icon class="avatar-fallback" name="person-circle"></ion-icon>
      <img
        src="{{this.dataAux.aux_fotoperfil}}"
        alt=""
        onerror="this.style.display='none'"
      />
    </ion-avatar>

    <ion-list class="app-list" lines="full">
      <ion-item>
        <ion-icon slot="start" name="person-outline"></ion-icon>
        <ion-label>Nombres</ion-label>
        <ion-input value="{{this.dataAuxPersona.p_nombres}}" readonly></ion-input>
      </ion-item>
      <ion-item>
        <ion-icon slot="start" name="person-outline"></ion-icon>
        <ion-label>Apellidos</ion-label>
        <ion-input value="{{this.dataAuxPersona.p_apellidos}}" readonly></ion-input>
      </ion-item>
      <ion-item>
        <ion-icon slot="start" name="card-outline"></ion-icon>
        <ion-label>Rut</ion-label>
        <ion-input value="{{this.dataAuxPersona.p_numdocumento}}" readonly></ion-input>
      </ion-item>
      <ion-item>
        <ion-icon slot="start" name="call-outline"></ion-icon>
        <ion-label>Teléfono</ion-label>
        <ion-input value="{{this.dataAux.aux_telefono}}" readonly></ion-input>
      </ion-item>
      <ion-item>
        <ion-icon slot="start" name="mail-outline"></ion-icon>
        <ion-label>Correo</ion-label>
        <ion-input value="{{this.dataAux.aux_correo}}" readonly></ion-input>
      </ion-item>
      <ion-item>
        <ion-icon slot="start" name="map-outline"></ion-icon>
        <ion-label>Comuna</ion-label>
        <ion-input value="{{this.dataAuxPersona.p_comuna}}" readonly></ion-input>
      </ion-item>
      <ion-item>
        <ion-icon slot="start" name="location-outline"></ion-icon>
        <ion-label>Dirección</ion-label>
        <ion-input value="{{this.dataAuxPersona.p_direccion}}" readonly></ion-input>
      </ion-item>
    </ion-list>

    <ion-button color="medium" fill="outline" (click)="dismiss()" shape="round" expand="block">
      Volver
    </ion-button>
  </div>
</ion-content>
