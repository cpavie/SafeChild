<ion-header>
  <ion-toolbar>
    <div class="sc-header-row">
      <div class="sc-header-titles">
        <p class="sc-eyebrow">{{ saludo }}</p>
        <p class="sc-title">{{ dataService.getDataApoderadoPersona().p_nombres }}</p>
      </div>
      <app-theme-toggle></app-theme-toggle>
      <ion-button class="sc-icon-btn" (click)="ayuda()">
        <ion-icon slot="icon-only" name="help-circle-outline"></ion-icon>
      </ion-button>
      <ion-button class="sc-icon-btn" (click)="logout()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="sc-stack">
    <p class="sc-section-title">Mis alumnos</p>

    <!-- Una tarjeta por alumno en vez de un ion-select: el estado "en
         ruta" es la informacion que el apoderado viene a buscar, y en
         un desplegable quedaba escondido hasta elegir. -->
    <div class="sc-card alumno-card" *ngFor="let alumno of alumnos">
      <div class="alumno-head">
        <div class="sc-avatar sc-avatar--md">
          <ion-icon class="avatar-fallback" name="person-circle"></ion-icon>
        </div>
        <div class="alumno-id">
          <div class="alumno-nombre">{{ alumno.nombre }}</div>
          <div class="alumno-furgon">Furgón {{ alumno.patente }}</div>
        </div>
        <span class="sc-badge" *ngIf="alumno.enRuta">En ruta</span>
        <span class="sc-badge sc-badge--muted" *ngIf="!alumno.enRuta">Sin ruta</span>
      </div>

      <!-- "Rastrear" se muestra siempre, tambien cuando el badge dice
           "Sin ruta": el badge es una foto del estado al abrir la
           pantalla, y esta pestaña no se recrea al volver a ella. Si el
           boton dependiera de esa foto, un apoderado que abrio la app
           antes de que el conductor iniciara la ruta se quedaria sin
           forma de llegar al rastreo. getInfoAlumno() relee alu_estado
           en Firestore al pulsarlo y avisa si todavia no salio. -->
      <div class="alumno-actions">
        <ion-button
          class="sc-btn sc-btn--short"
          expand="block"
          [fill]="alumno.enRuta ? 'solid' : 'outline'"
          (click)="getInfoAlumno(alumno.id)"
        >
          <ion-icon slot="start" name="location-outline"></ion-icon>
          Rastrear
        </ion-button>
        <ion-button class="sc-btn sc-btn--short edit-btn" fill="outline" (click)="editAlumno(alumno.id)">
          <ion-icon slot="icon-only" name="create-outline"></ion-icon>
        </ion-button>
      </div>
    </div>

    <p class="alumnos-vacio" *ngIf="!cargando && alumnos.length === 0">
      No hay alumnos asociados a su cuenta.
    </p>
  </div>
</ion-content>
