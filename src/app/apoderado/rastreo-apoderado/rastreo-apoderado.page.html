<ion-header>
  <ion-toolbar>
    <ion-title>Rastreo</ion-title>
    <ion-buttons slot="end">
      <app-theme-toggle></app-theme-toggle>
      <ion-button (click)="ayuda()">
        <ion-icon slot="icon-only" name="help-circle-outline"></ion-icon>
      </ion-button>
      <ion-button (click)="logout()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="app-card">
    <div class="card-header-row">
      <p class="welcome-text">
        Bienvenido {{this.dataService.getDataApoderadoPersona().p_nombres}}
      </p>
      <span class="status-badge">En ruta</span>
    </div>
    <p class="tracking-text">
      Usted está viendo el recorrido de {{this.dataService.getDataAlumnoPersona().p_nombres}}
    </p>
  </div>

  <div class="map-card">
    <div id="map1" class="map-el"></div>
  </div>

  <div class="app-card actions-card">
    <ion-button size="small" shape="round" expand="block" fill="outline" (click)="goInfoConductor()">
      <ion-icon slot="start" name="person-outline"></ion-icon>
      Info conductor
    </ion-button>
    <ion-button size="small" shape="round" expand="block" fill="outline" (click)="goInfoAuxiliar()">
      <ion-icon slot="start" name="people-outline"></ion-icon>
      Info auxiliar
    </ion-button>
    <ion-button size="small" shape="round" expand="block" fill="outline" (click)="goInfoFurgon()">
      <ion-icon slot="start" name="bus-outline"></ion-icon>
      Info furgón
    </ion-button>
  </div>
</ion-content>
