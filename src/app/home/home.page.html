<ion-content fullscreen="true" class="login-content">
  <div class="login-hero">
    <img class="login-logo" src="assets/img/furgon01.png" alt="Furgón escolar" />
    <h1 class="login-title">SafeChild</h1>
    <p class="login-tagline">Sigue el furgón de tus niños en tiempo real</p>
  </div>

  <div class="login-body">
    <!-- El rol dejo de ser un ion-segment: como decide a que app entra
         el usuario, el diseño le da dos tarjetas con icono y una linea
         que explica que hace cada rol. -->
    <div class="role-grid">
      <div
        class="role-card"
        [class.role-card--on]="type === 'apoderado'"
        (click)="type = 'apoderado'"
      >
        <ion-icon name="people-outline"></ion-icon>
        <span class="role-name">Apoderado</span>
        <span class="role-desc">Rastreo y datos del alumno</span>
      </div>
      <div
        class="role-card"
        [class.role-card--on]="type === 'conductor'"
        (click)="type = 'conductor'"
      >
        <ion-icon name="bus-outline"></ion-icon>
        <span class="role-name">Conductor</span>
        <span class="role-desc">Iniciar y cerrar ruta</span>
      </div>
    </div>

    <div class="sc-fields">
      <div class="sc-field">
        <ion-icon name="mail-outline"></ion-icon>
        <div class="sc-field-body">
          <div class="sc-field-label">Correo</div>
          <ion-input
            type="email"
            inputmode="email"
            autocomplete="email"
            [(ngModel)]="email"
          ></ion-input>
        </div>
      </div>
      <div class="sc-field">
        <ion-icon name="lock-closed-outline"></ion-icon>
        <div class="sc-field-body">
          <div class="sc-field-label">Contraseña</div>
          <ion-input
            [type]="passwordShown ? 'text' : 'password'"
            autocomplete="current-password"
            [(ngModel)]="password"
          ></ion-input>
        </div>
        <ion-icon
          class="pw-toggle"
          [name]="passwordShown ? 'eye-off-outline' : 'eye-outline'"
          (click)="passwordShown = !passwordShown"
        ></ion-icon>
      </div>
    </div>

    <div class="login-actions">
      <ion-button class="sc-btn sc-btn--tall" expand="block" (click)="onSubmitLogin()">
        {{ type === 'conductor' ? 'Ingresar como conductor' : 'Ingresar' }}
        <ion-icon slot="end" name="arrow-forward"></ion-icon>
      </ion-button>
      <ion-button class="sc-btn" expand="block" fill="clear" (click)="goResetPassword()">
        Olvidé mi contraseña
      </ion-button>
    </div>

    <div class="login-footer">
      <app-theme-toggle variant="chip"></app-theme-toggle>
      <p>
        ¿Quiere contar con nuestro servicio?<br />
        <a href="mailto:pavieclaudio@gmail.com">Contáctenos</a>
      </p>
    </div>
  </div>
</ion-content>
