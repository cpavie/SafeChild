<ion-header>
  <ion-toolbar>
    <div class="sc-header-row">
      <div class="sc-header-titles">
        <p class="sc-eyebrow">Conductor</p>
        <p class="sc-title">{{ dataService.getDataConductorPersona().p_nombres }}</p>
      </div>
      <app-theme-toggle></app-theme-toggle>
      <ion-button class="sc-icon-btn" (click)="ayuda()">
        <ion-icon slot="icon-only" name="help-circle-outline"></ion-icon>
      </ion-button>
      <ion-button class="sc-icon-btn" (click)="logout()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="sc-stack">
    <div class="roster-head">
      <p class="sc-section-title">Alumnos de hoy</p>
      <span class="roster-count">{{ seleccionados.length }} de {{ roster.length }} seleccionados</span>
    </div>

    <!-- La fila entera es el area de toque, no solo la casilla: el
         conductor marca alumnos de pie y en movimiento. -->
    <div class="sc-rows">
      <div
        class="sc-row sc-row--bordered"
        [class.sc-row--selected]="alumno.on"
        *ngFor="let alumno of roster"
        (click)="alumno.on = !alumno.on"
      >
        <div class="sc-avatar sc-avatar--sm">
          <ion-icon class="avatar-fallback" name="person-circle"></ion-icon>
        </div>
        <div class="sc-row-body">
          <div class="sc-row-title">{{ alumno.nombre }}</div>
          <div class="sc-row-sub">{{ alumno.direccion }}</div>
        </div>
        <div class="sc-check" [class.sc-check--on]="alumno.on">
          <ion-icon *ngIf="alumno.on" name="checkmark"></ion-icon>
        </div>
      </div>
    </div>

    <p class="sc-section-title auxiliar-title">Auxiliar a bordo</p>
    <div class="auxiliar-chips">
      <div
        class="sc-chip"
        [class.sc-chip--on]="bind === auxiliar.id"
        *ngFor="let auxiliar of auxiliares"
        (click)="bind = auxiliar.id"
      >
        <ion-icon name="people-outline"></ion-icon>
        <span>{{ auxiliar.nombre }}</span>
      </div>
    </div>
  </div>
</ion-content>

<!-- El CTA vive fijo al pie, fuera del scroll: es la unica accion de la
     pantalla y no debe quedar bajo la lista de alumnos. -->
<ion-footer class="comenzar-footer">
  <ion-button
    class="sc-btn sc-btn--tall"
    expand="block"
    [disabled]="!puedeComenzar"
    (click)="comenzarRuta()"
  >
    <ion-icon slot="start" name="play"></ion-icon>
    Comenzar ruta
  </ion-button>
  <p class="comenzar-hint" *ngIf="!puedeComenzar">
    Seleccione alumnos y un auxiliar para comenzar
  </p>
</ion-footer>
