<!-- Igual que el rastreo del apoderado: mapa a pantalla completa con la
     cabecera flotante y la hoja de alumnos a bordo. -->
<ion-content fullscreen="true" scroll-y="false">
  <div class="sc-map-layout">
    <div class="sc-map-wrap">
      <div id="map1" class="sc-map"></div>

      <div class="sc-map-overlay sc-glass">
        <div class="sc-row-body">
          <div class="sc-row-title">Ruta en curso</div>
          <div class="sc-row-sub">
            {{ ids_alumnos.length }}
            {{ ids_alumnos.length === 1 ? 'alumno a bordo' : 'alumnos a bordo' }}
            <ng-container *ngIf="dataService.getDataAuxiliarPersona().p_nombres">
              · {{ dataService.getDataAuxiliarPersona().p_nombres }}
            </ng-container>
          </div>
        </div>
        <span class="sc-badge">En ruta</span>
      </div>

      <div class="sc-map-fabs">
        <div class="sc-map-fab sc-glass" (click)="recentrar()">
          <ion-icon name="locate-outline"></ion-icon>
        </div>
        <app-theme-toggle variant="fab"></app-theme-toggle>
        <div class="sc-map-fab sc-glass" (click)="ayuda()">
          <ion-icon name="help-circle-outline"></ion-icon>
        </div>
      </div>
    </div>

    <div class="sc-sheet">
      <div class="sc-sheet-handle"></div>
      <div class="sc-sheet-body">
      <p class="sc-section-title">Alumnos a bordo</p>

      <div class="sc-rows abordo-rows">
        <div class="sc-row" *ngFor="let nombre of nombres_alumnos; let i = index">
          <div class="sc-avatar sc-avatar--sm sheet-avatar">
            <ion-icon class="avatar-fallback" name="person-circle"></ion-icon>
          </div>
          <div class="sc-row-body">
            <div class="sc-row-title">{{ nombre }}</div>
            <div class="sc-row-sub">A bordo</div>
          </div>
          <!-- "Bajar" en vez de un chevron: el diseño nombra la accion
               porque marca la entrega del alumno, no un despliegue. -->
          <div class="bajar-btn" (click)="finalizarRutaAlum(ids_alumnos[i])">Bajar</div>
        </div>
      </div>

      <!-- No se puede cerrar la ruta con alumnos arriba: hacerlo les
           avisaba a sus apoderados que ya habian llegado. La ruta
           termina sola al bajar al ultimo. -->
      <ion-button
        class="sc-btn"
        expand="block"
        color="danger"
        [disabled]="!puedeFinalizar"
        (click)="finalizarRuta()"
      >
        <ion-icon slot="start" name="stop-circle-outline"></ion-icon>
        Finalizar ruta
      </ion-button>
      <p class="finalizar-hint" *ngIf="!puedeFinalizar">
        Baje a todos los alumnos para finalizar la ruta
      </p>
      </div>
    </div>
  </div>
</ion-content>
