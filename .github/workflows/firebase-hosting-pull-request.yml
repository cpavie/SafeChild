# Este workflow lo genero el CLI de Firebase, pero su paso de build era
# `run: 'n'`, que no compila nada: el check se ponia en rojo en cada PR
# sin haber validado una sola linea. Ahora el build es real y va en su
# propio job, separado del deploy de preview.
#
# El deploy sigue necesitando el secreto FIREBASE_SERVICE_ACCOUNT_...,
# que hoy NO esta configurado en el repositorio. En vez de arrastrar al
# workflow entero al rojo por eso, el job de preview se salta cuando el
# secreto falta (y tambien en PRs desde un fork, que no reciben
# secretos): asi el resultado del build, que es lo que de verdad
# valida, se ve limpio.
#
# Para activar la preview: Settings > Secrets and variables > Actions >
# New repository secret, con el nombre de abajo y el JSON de una cuenta
# de servicio con rol "Firebase Hosting Admin".
#
# El lint NO corre aqui a proposito: hoy hay 512 errores preexistentes
# (411 de ellos por comillas dobles, que es el estilo real del codigo),
# asi que activarlo dejaria el check en rojo por defecto, que es
# justamente el problema que este cambio arregla. Ver el punch list.

name: CI y preview de Firebase Hosting
'on': pull_request

jobs:
  build:
    name: Compilar
    runs-on: ubuntu-latest
    outputs:
      desplegar: ${{ steps.secreto.outputs.desplegar }}
    steps:
      - uses: actions/checkout@v4

      # Node 16: la version que pide Angular 10 (ver el punch list, la
      # actualizacion de dependencias sigue pendiente).
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar en modo produccion
        run: npx ng build --configuration production

      # Se sube el resultado para que el job de preview no tenga que
      # volver a instalar y compilar todo.
      - name: Guardar el build
        uses: actions/upload-artifact@v4
        with:
          name: www
          path: www
          retention-days: 5

      # El contexto `secrets` no se puede usar en un `if`, asi que se
      # pasa por una salida del job.
      - name: Comprobar si hay credenciales para la preview
        id: secreto
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FURGONCITO_EB920 }}
        run: |
          if [ -n "$SA" ]; then
            echo "desplegar=true" >> "$GITHUB_OUTPUT"
          else
            echo "desplegar=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No hay secreto FIREBASE_SERVICE_ACCOUNT_FURGONCITO_EB920; se omite la preview."
          fi

  preview:
    name: Preview de Hosting
    needs: build
    if: needs.build.outputs.desplegar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recuperar el build
        uses: actions/download-artifact@v4
        with:
          name: www
          path: www

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FURGONCITO_EB920 }}'
          projectId: furgoncito-eb920
